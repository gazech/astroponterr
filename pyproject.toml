[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asterrpont"
version = "0.0.0"
authors = [
    {name = "Huntington Gazecki", email = 'gazecki.hunt@gmail.com'}
]
maintainers = [
    {name = "Huntington Gazecki", email = 'gazecki.hunt@gmail.com'}
]
description = "digital sextant"
readme = {file = "readme.md", content-type = "text/markdown"}
license = "MIT AND (Apache-2.0 OR BSD-2-Clause)"
requires-python = ">= 3.12"

dependencies = [
    # "astrometry.net", #how best to pin this?
    "astrometry>=4.3.0",
    "astropy>=7.0.1",
    "numpy", #>=2.2.4",
    "opencv-python>=4.11.0.86",
    "polars>=1.26.0",
    "scipy", #>=1.15.2",
    "skyfield>=1.52",
    #"starcatalogquery>=1.1.5",
]


[project.optional-dependencies]
gui = [
    "matplotlib>=3.10.1",
    "pyqt6>=6.8.1",
]
nb = [
    "jupyter>=1.1.1",
]


[dependency-groups]
dev = [
    "ipython>=9.0.2",
    "pre-commit>=4.2.0",
    "pytest>=9.1.1",
    "ruff>=0.11.2",
    "uv>=0.6.11",
]
